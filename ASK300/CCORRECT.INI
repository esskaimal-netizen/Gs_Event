;Sharpness
;	These are default value for sharpness.
;	When you want to change the sharpness value in your application,
;	please set ON into USE_APP_VALUE.
;	When you want to use the default value as the sharpness value,
;	please set OFF into USE\APP_VALUE.

[PRINTER_SHARPNESS]
USE_APP_VALUE=ON
ASK1500_DEFAULT=0
ASK4000_DEFAULT=2
ASK2000_DEFAULT=4
ASK4000A_DEFAULT=2
ASK2500_DEFAULT=4
ASK300_DEFAULT=4
ASK5000_DEFAULT=-1

;Color Correction Tool
;	When you want to change parameters for Color Correction Tool,
;	you rewrite this file and copy this to the same directory of 
;	your application.
;	When you use default values for Color Correction Tool,
;	you delete this file from the same directory of your application.
;
;
[INPUT_PARAM_RANGE]
PARAM_MIN_RANGE=-20 
PARAM_MAX_RANGE=20

PARAM_BRIGHTNESS_RANGE=7

[CALC_STEP]
D_STEP=0.05
CMY_STEP=0.03

[LINEAR]
MAX_KEY=15
MAX_OFFSET=30.0

[GAMMA_CURVE]
MAX_KEY=15
MAX_GAMMA=1.3

[FWVersion]
version1=316F21
